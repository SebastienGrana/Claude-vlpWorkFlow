# Les réglages des outils d'atelier, et eux seuls (MET1, Q10) : rien ici ne tourne
# chez qui utilise le kit — commandes et hooks restent sans paquet (`methode-chantier.md`,
# « Coder dans le kit »). L'atelier passe par `uv` : `uv sync`, puis `uv run …` (REF3, D4).

[project]
name = "vlp-atelier"
version = "0"
requires-python = ">=3.14"

[dependency-groups]
# Versions lues sur PyPI le 2026-10-17 (`context AI/122-qualite-code-tests.md`, « Versions ») ;
# ruff et pyright à celles que le cliquet et le commit lancent déjà.
dev = [
    "pytest==9.1.1",
    "coverage==7.16.2",
    "diff-cover==10.6.0",
    "syrupy==6.1.1",
    "pytest-regtest==2.7.0",
    "ruff==0.16.10",
    "pyright==1.1.414",
]

[tool.uv]
# Pas de paquet à construire : le kit n'est qu'un dossier de scripts. uv est en 0.x, cassant d'une
# version mineure à l'autre : une autre version refuse de tourner, au lieu de lire le verrou autrement.
package = false
required-version = ">=0.13.1,<0.14"

[tool.pytest]
# La suite pytest, côte à côte avec `scripts/test-vlp.py` jusqu'aux portes de parité (REF4, D1). L'import par
# chemin (`importlib`) : aucun `__init__.py`, aucun nom de module partagé. Sur le chemin : `tests/` pour `aides`,
# `scripts/` pour les voisins que `vlp_coeur.py` importe par leur nom (`carnet`, `vlp_hook`) — jamais
# `test-vlp.py`, que son tiret rend inimportable et que `testpaths` ne collecte pas.
# `strict` : une option inconnue, une marque non déclarée ou un xfail qui passe font échouer (REF4, D3).
testpaths = ["tests"]
pythonpath = ["tests", "scripts"]
addopts = ["--import-mode=importlib", "-p", "no:cacheprovider"]
strict = true
tmp_path_retention_policy = "failed"

[tool.pyright]
# Ex-`pyrightconfig.json`, retiré : un `.json` présent prime en silence sur ce bloc (REF3).
include = ["scripts"]
typeCheckingMode = "standard"

[tool.ruff]
# Le Python de l'atelier, 3.14 (REF3, D4) ; les remarques nouvelles vont à la découpe, pas ici.
target-version = "py314"

[tool.ruff.lint]
# On part des règles que ruff active d'office (MET5, Q3), et on n'en retire que ce
# que l'utilisateur a écarté le 2026-10-07. Le pourquoi de chacune est au journal :
# context AI/08-etat.md, entrée « MET5 — ruff trié ».
ignore = [
    "UP031",    # le % pour formater : le style de tout le kit
    "FURB167",  # re.I plutôt que re.IGNORECASE : même sens
    "DTZ",      # date.today() à l'heure locale : voulu
    "TRY",      # ValueError attrapée pour afficher une GARDE
    "FLY",      # join gardé, pas de f-string imposée
    "FA",       # from __future__ import annotations : écarté avec 3.9
]
