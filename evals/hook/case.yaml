schema_version: "1.1"
name: hook
runs: 1
tags: [hook]

execution:
  max_turns: 6
  timeout_seconds: 300
  allowed_tools: [Read, Write]

graders:
  - name: writes-with-write
    type: tool_used
    tool: Write

  - name: hook-reports-invalid
    type: regex
    target: trace
    pattern: "INVALIDE [0-9]+ fiches"
    match: contains
