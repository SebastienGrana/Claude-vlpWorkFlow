schema_version: "1.1"
name: filet-vue
runs: 1
tags: [filet-vue, wsl2]

execution:
  max_turns: 80
  timeout_seconds: 300
  # Skill pour le chef ; Read pour le sous-agent vlp:fiche que vlp:jouer forke —
  # le allowed_tools du cas vaut pour tout le run, sous-agent compris. Bash (la carte
  # injectée par vlp:jouer, et l'agent) se donne à l'invocation : --allow-tools Bash,
  # sous WSL2 seulement (pas de sandbox sous Windows natif). EVF1, 2026-09-26.
  allowed_tools: [Skill, Read]

context:
  scaffold_script: fixture.sh

graders:
  # Le chef n'a que Skill : si un appel Read apparaît dans la trace, il vient
  # forcément du sous-agent vlp:jouer/vlp:fiche — c'est la preuve qu'on cherche.
  - name: read-appears-in-trace
    type: tool_used
    tool: Read

  - name: subagent-content-in-trace
    type: regex
    target: trace
    pattern: "fichier 05"
    match: contains

  # Témoin négatif : n13.txt n'existe pas (le bac n'a que n01..n12). Ce grader
  # doit ÉCHOUER — sinon les deux graders ci-dessus ne prouvent rien.
  - name: negative-witness-fichier-13
    type: regex
    target: trace
    pattern: "fichier 13"
    match: contains
