schema_version: "1.1"
name: init
runs: 1
tags: [init, wsl2]

execution:
  max_turns: 25
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit, Bash]

graders:
  - name: runs-vlp-init-command
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?vlp:init"'

  - name: writes-chantier
    type: file_exists
    path: "CHANTIER.md"

  - name: writes-context-dir
    type: file_exists
    path: "*/*-etat.md"

  - name: publishes-nothing
    type: tool_used
    tool: Artifact
    min: 0
    max: 0
