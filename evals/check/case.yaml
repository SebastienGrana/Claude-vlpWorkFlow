schema_version: "1.1"
name: check
runs: 1
tags: [check, vérification, wsl2]

execution:
  max_turns: 15
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Skill, Bash]

context:
  scaffold_script: fixture.sh

graders:
  - name: detects-inconsistency
    type: regex
    target: last_message
    pattern: "(existe|existence|présence|accessible|absent|manque|inexistant|n'existe pas|does not exist|file.*not found)"
    flags: ""
    match: contains

  - name: runs-vlp-check-command
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?vlp:check"'
